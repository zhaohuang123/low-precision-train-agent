quant_notes:
  moe_experts_covered: "不覆盖 —— MoE 专家层与 dense MLP 的量化路径不同：框架里 expert 的假量化走 experts.py 的独立分支，dense linear 走 core/qat/layers.py 的 patch；w4a4-mxfp4 不在 expert 分支覆盖的 scheme 里，所以在 MoE 模型上它会量到非专家线性层、不会量专家。（照搬旧档 §4，P6 未复核框架检出）"
  scope_source: "MoE 专家：experts.py 独立分支（权重按 weight.view(-1, hidden) 再切回专家粒度）；dense linear：core/qat/layers.py 的 patch。详见旧工程 knowledge/frameworks/mindspeed-llm-qat.md 的能力表 / 缺口表（带 file:line；本工程 P6 未迁入该扫描笔记）。"
  quantized_linears: {value: null, source: "✗ 待确认 —— 先补 layers 与作用范围才能算（本机无该模型）"}
  risks: >-
    ① 压缩注意力 / 压缩器（compressor）是最敏感的地方：DSA 通路里 KV 先经过 compressor 压缩，layer_policy（回退哪些层）
    在这个模型上风险最高 —— 回退错了层等于在压缩通路上加噪声。第一轮先别动压缩相关投影。
    ② MQA（kv_heads = 1）：KV 侧只有一个头，per-channel / per-head 类统计样本量极小，量化统计量容易不稳。
    ③ MTP 层是额外的层：做「回退层表」或「逐层敏感度分析」时别忘了 num_nextn_predict_layers，只按 num_hidden_layers
    枚举会漏掉它们（框架转换代码就是分开校验的）。
    ④ mla_mm_split 等 split 开关会改变投影的形状拆分 ⇒ 按投影名字写的层表可能匹配不上；声明了层表就必须验证真的命中。
    ⑤ HF 侧 embedding / lm_head：DeepSeek 系列通常不 tie，仍要读 tie_word_embeddings 确认。

memory:
  per_card_blocks:
    config: "待 config 补齐后填；旧档只给算式（本机无该模型，无本地锚点）"
    symbols: "P = 总参数量、L = 层数、h = hidden size、s = seq_len、b = micro batch size、TP/PP/DP/EP = 并行度"
    blocks:
      - {block: "权重", formula: "P × bytes/param / (TP × PP)；bf16 = 2；w4 ≈ 0.5 + scale 开销", key_point: "⚠️ 单卡放不下是已知事实（推理侧 554GB/rank 即使 EP16 也要 TP2DP8）；训练侧 EP 必须开，且还要给梯度/优化器状态留位置"}
      - {block: "梯度", formula: "P_trainable × bytes / (TP × PP)", key_point: "MoE 只对被激活专家产生梯度，但显存常按全量预留"}
      - {block: "优化器状态", formula: "Adam ≈ 12 bytes/param", key_point: "对 ~291B 量级，这是最大的一块；EP/ZeRO 之外基本无解"}
      - {block: "激活", formula: "b × s × h × L 量级，开 recompute 折半/不折", key_point: "MTP 层会额外占一份前向激活；压缩注意力本身有额外缓冲"}
      - {block: "通信缓冲", formula: "allreduce / allgather / dispatch / combine 的桶大小 × 并发", key_point: "MoE dispatch/combine 是独立的一块；HCCL_BUFFSIZE 必须显式调（推理档案里 HCCL_BUFFSIZE=1024 是「必带」）"}
    source: "旧档 §3（算式逐条照搬；数值待 config 补齐后填）"
  anchors: []          # 旧档没有训练侧本地锚点；只有推理侧实测拓扑，见 memory.notes_parallel
  notes_parallel: >-
    推理侧实测拓扑（**不是训练配置，别直接抄**）：910C/A3 16 die = TP2DP8EP16（EP-off 不可行：554GB/rank > 64GB/die）；
    950DT/A5 8 卡×96GB = TP2DP4EP8。⚠️「554GB/rank > 64GB/die」对训练侧极有参考价值：权重总量单卡完全放不下，
    EP 是必须的、不是可选项（训练侧更紧张，还要放梯度与优化器状态）。
    判据式写法：若「权重 + 梯度 + 优化器状态」已超单卡显存 × 0.8 → 先降 TP / 加卡 / 上 ZeRO-offload（因为激活还没算进去）；
    若激活预算超了 → 先开 recompute，不要砍 seq_len（seq_len 是格子键之一，改了历史结论不可比）。
    ⚠️ MoE 的「容量到顶」结论必须先核实是不是通信缓冲截断（推理档案里明确记过「曾被误判为 HBM 带宽墙，差 2 个数量级」）。

notes: |
  【0. 对量化最要命的一点（旧档 §0，照搬）】
  压缩注意力 / 压缩器（compressor）把 KV 压过一遍，压缩矩阵比普通投影敏感得多。技术库里的轴 layer_policy
  （回退哪些层）在这个模型上要特别小心 —— 回退错了层，等于在压缩通路上加噪声。

  【2.1 已知的框架接线（旧档 §2.1；这些行号照搬旧档、P6 未复核框架检出）】
