quant_notes:
  moe_experts_covered: "不适用 —— 本模型是 dense，无专家层。知识库缺口 G1（w4a4-mxfp4 不覆盖 MoE 专家层）在这台模型上不成立，判 trainability 时不要照抄 MoE 的结论。"
  scope_source: "量化作用范围 = 每层的 QKV/O/gate/up/down，由唯一 patch 挂点决定（megatron.core.tensor_parallel.layers.LinearWithGradAccumulationAndAsyncCommunication）；实现见 mindspeed_llm/features_manager/qat/qat_quant_engine.py:87-96。★ 框架里没有 quant_scope 配置项（缺口 G6）—— 作用范围由方案名 ＋ 挂点隐含，不能「配」。（file:line 照搬旧档 §2，P6 未复核框架检出）"
  quantized_linears: {value: 252, source: "36 层 × 7 = 252 个被量化的线性层（已实测）；驱动自证行「[w4a4-had] … | 252 quantized, 1 excluded」（旧工程 records/rounds/Qwen3-4B__w4a4/R-0003/evidence/rot_banner_*.txt 与 R-0002 的同一行）；excluded 1 = lm_head（由 W4A4_QHEAD=0 显式排除）；embedding / lm_head 不在挂点上"}
  risks: "4bit 激活的主要风险点是激活离群值（逐 token 变化）；权重分布固定，风险较小。MXFP4 = 每 32 元素块共享指数（w4a16_fake_quantization.py:73-110），块内离群值会把同块其余元素压成 0；抑制它的机制是旋转（knowledge/techniques/ 的旋转类条目），R-0002 按用户要求不启用。qk-layernorm 对量化的影响未确认。"

