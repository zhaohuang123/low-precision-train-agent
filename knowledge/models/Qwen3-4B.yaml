        里有算式（q 10.49M / k,v 2.62M / o 10.49M / gate,up,down 各 24.90M，每层 100.92M，36 层 3.633B）。
  - [ ] 评测侧显存峰值未记录（R-0001 只记了训练侧 36.4GB）。
  - [ ] qk-layernorm 对 4bit 激活量化误差的影响：未查。
