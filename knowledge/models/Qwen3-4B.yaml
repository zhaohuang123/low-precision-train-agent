notes: |
  【0. 一句话与对工程最直接的一条】
  ★ 对本工程最直接的一条：它是 dense，所以知识库缺口 G1（w4a4-mxfp4 不覆盖 MoE 专家层）在这台模型上不成立
  —— 判 trainability 时不要照抄 MoE 的结论。
  本档由 lp-architect 在 R-0002 设计期间补 —— 此前知识库里没有这个模型的档案（只有 Qwen3.5-35B-A3B 与
  DeepSeek-V4-Flash），而它正是本工程 Qwen3-4B__w4a4 这个格子上的主体模型。

  【3. 并行可行域（适用边界）】
  - TP：1（实测够用）；理论上 {1,2,4,8}。约束：GQA 下 TP 需能整除查询组数（8）；本模型 hidden 2560 不需要分片。
  - PP：1。36 层、无流水线需求；PP>1 会改激活分布并引入气泡。
  - DP：= 可见卡数。--use-distributed-optimizer 的优化器态按 DP 分片 ⇒ 想「接续载入优化器态」，DP 必须与产出
    该 ckpt 时一致（R-0002 的 rank5 臂依赖这条；该结论为推断，未实测）。
  - EP：不适用（dense）。
  - --sequence-parallel：训练侧 R-0001 已有；评测侧缺失（R-0001 的 eval_gsm8k_qwen3_4b.sh 三个使能 flag 全缺）。
    ★ 它不只是性能开关：qat_quant_engine.py:70-83 用它作为「是否注册 QAT 补丁」的条件之一；缺它 ⇒ 评测侧静默不量化。
    （file:line 照搬旧档 §4，P6 未复核框架检出）

  【★ 2026-10-16（Stage-0 真机，R-0006）两条会咬人的事实（照搬旧档 §4）】
  1. param.main_param is None 是 dist-opt 下的合法状态（distrib_optimizer.py:530-549：每个 16-bit 参数先统一置 None，
     只有「在本 rank 上有优化器态」的参数会被换成对应的分片 main_param）⇒ 它含义是「本 rank 不持有这个参数的优化器态」，
     不是「本配方没有 fp32 master」。实测：8 卡 5 步冒烟里 3 个抽样层的 master 整个归 rank 7（world_range 是 param[0,全量)），
     rank 0-6 全都拿不到 ⇒ 任何「要求每个 rank 都核到同一批层」的复核代码必然红。⇒ 复核要按 rank 记录「我核到了哪些层」，
     跨 rank 用并集判覆盖（fail-closed：某层在所有 rank 上都没被核到 ⇒ 红）。
  2. Megatron 在最后一个 iteration 会无条件落一次 ckpt，与 --save-interval 无关 ⇒ 5 步冒烟用过一次 53 GB
     （落在仓内 records/ 里）。CKPT_SAVE_DIR 默认必须在仓外（/data/lp-explorer/...）；
     scaffold/commands/train_qat_rotate.sh 现在对「仓内落点」直接 exit 2（要跑得显式 LP_ALLOW_CKPT_IN_REPO=1）。
  ★ 2026-10-16 补一条实测的相关事实：dist-opt 下 fp32 master 也是分片的 —— param.main_param 只持有参数本地视图的
     _get_model_param_range_map(param)["param"] 那一段（distrib_optimizer.py:2077-2081；装入点 :333-342/:378-379）。
     ★ 别拿 gbuf_world_in_bucket 去切参数本地视图 —— 那是 model_param_buffer 回写路径（:2028-2048）的另一套坐标，
     ≥2 rank 时起点带桶偏移，元素数会对不上（R-0006 真机前踩过，见该轮 review.md A 项）。⇒ 任何「在 master 上做整体变换」
     的实现都不能假设整份 master 在手边，而要按参数本地区间对齐。

  【更正记录（lp-architect，2026-10-14；照搬旧档 §2）】
  本档原先写「× 6 = 216，推算未实测」—— 错。实测依据：驱动的自证行「[w4a4-had] … | 252 quantized, 1 excluded」
  （records/rounds/Qwen3-4B__w4a4/R-0003/evidence/rot_banner_*.txt 与 R-0002 的同一行）。差额来自漏数 o_proj
  （attention 的 4 个投影里 o 是独立的一项）。252 = 36×7、excluded 1 = lm_head ⇒ 两条都能对上。

  【5. 未确认 / 待补（照搬旧档 §5）】
  - [x] 216 个线性层是推算 → 252 已实测（36×7；驱动自证行 252 quantized, 1 excluded，2026-10-14 由 lp-architect 更正）。
